name: Build and deploy ASP.Net Core API to Azure

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.x'
  AZURE_WEBAPP_NAME: 'apicsgoat'

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore S5_01_App_CS_GOAT/S5_01_App_CS_GOAT.csproj

      - name: Create web.config for Azure
        run: |
          cat > S5_01_App_CS_GOAT/web.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath="dotnet"
                           arguments=".\S5_01_App_CS_GOAT.dll"
                           stdoutLogEnabled="true"
                           stdoutLogFile=".\logs\stdout"
                           hostingModel="inprocess" />
              </system.webServer>
            </location>
          </configuration>
          EOF

      - name: Run tests
        run: dotnet test --no-build

      - name: Publish
        run: dotnet publish S5_01_App_CS_GOAT/S5_01_App_CS_GOAT.csproj --configuration Release --output ./publish

      - name: Verify publish output
        run: |
          echo "📦 Published files:"
          ls -la ./publish
          echo ""
          echo "🔍 Looking for DLL files:"
          find ./publish -name "*.dll" -type f
          echo ""
          echo "🔍 Total file count:"
          find ./publish -type f | wc -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: ./publish

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: https://apicsgoat-h7bhhpd4e7bnc9bh.eastus-01.azurewebsites.net

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-app
          path: ./deploy

      - name: Verify deployment package
        run: |
          echo "📦 Deployment package contents:"
          ls -la ./deploy
          echo ""
          echo "🔍 DLL files:"
          find ./deploy -name "*.dll"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ./deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0F174ECCD58449D69FC6568F12FE72C6 }}

      - name: Wait for deployment to complete
        run: sleep 30

      - name: Check if app is responding
        run: |
          echo "🔍 Testing API health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://apicsgoat-h7bhhpd4e7bnc9bh.eastus-01.azurewebsites.net || echo "000")
          echo "Status code: $STATUS"

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
            echo "✅ App is running (even if endpoint returns 404, the app started)"
          else
            echo "⚠️ App may not have started properly. Status: $STATUS"
            echo "Check Azure Portal logs for details"
          fi

