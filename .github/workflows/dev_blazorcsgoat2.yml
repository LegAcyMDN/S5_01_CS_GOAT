#          path: '**/TestResults/*.trx'
#          reporter: dotnet-trx
#          fail-on-error: true

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build, test-local]
    environment:
      name: 'Production'
      url: ${{ env.AZURE_WEBAPP_URL }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: blazor-app
          path: ./deploy

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ./deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9F5ACB30360144EF98849902B6337D4F }}

  test-azure:
    name: Run E2E Tests (Azure)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test dependencies
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build test project
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} -c Release --no-restore

      - name: Install Playwright browsers
        run: pwsh S5_01_Blazor_CS_GOATTests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E Tests against Azure
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed"
        env:
          TEST_ENVIRONMENT: Azure
        timeout-minutes: 15

