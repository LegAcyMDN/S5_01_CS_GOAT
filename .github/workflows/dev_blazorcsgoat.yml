name: Build, Test, and Deploy Blazor to Azure

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.x'
  BLAZOR_PROJECT_PATH: 'S5_01_Blazor_CS_GOAT/S5_01_Blazor_CS_GOAT.csproj'
  TEST_PROJECT_PATH: 'S5_01_Blazor_CS_GOATTests/S5_01_Blazor_CS_GOATTests.csproj'
  AZURE_WEBAPP_NAME: 'blazorcsgoat'
  AZURE_WEBAPP_URL: 'https://blazorcsgoat-hpbpdkhmadduekef.eastus-01.azurewebsites.net'

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.BLAZOR_PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.BLAZOR_PROJECT_PATH }} -c Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.BLAZOR_PROJECT_PATH }} -c Release -o ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blazor-app
          path: ./publish/wwwroot

  test-local:
    name: Run E2E Tests (Local)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Blazor project
        run: dotnet restore ${{ env.BLAZOR_PROJECT_PATH }}

      - name: Restore test dependencies
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build test project
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} -c Release --no-restore

      - name: Install Playwright browsers
        run: pwsh S5_01_Blazor_CS_GOATTests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Trust dev certificate
        run: dotnet dev-certs https --trust

      - name: Run Blazor app
        run: |
          cd S5_01_Blazor_CS_GOAT
          dotnet run --no-build --configuration Release &
          echo $! > ../server.pid
          cd ..

      - name: Verify server is running
        run: |
          if ! kill -0 $(cat server.pid) 2>/dev/null; then
            echo "Server failed to start"
            exit 1
          fi
          echo "Server is running with PID $(cat server.pid)"

          # Test if it's responding (with --insecure for dev cert)
          for i in {1..30}; do
            if curl -k -s https://localhost:7030 > /dev/null; then
              echo "Server is responding on HTTPS!"
              exit 0
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
          echo "Server failed to respond after 60 seconds"
          exit 1

      - name: Run E2E Tests
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed"
        env:
          TEST_ENVIRONMENT: Local
        timeout-minutes: 15

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-local
          path: '**/TestResults/*.trx'

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-local
          path: '**/test-results/**'
          retention-days: 7

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results (Local)
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build, test-local]
    environment:
      name: 'Production'
      url: ${{ env.AZURE_WEBAPP_URL }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: blazor-app
          path: ./deploy

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ./deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_7F9E85A1AA744ABEBECAFB00415B4D78 }}

  test-azure:
    name: Run E2E Tests (Azure)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test dependencies
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build test project
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} -c Release --no-restore

      - name: Install Playwright browsers
        run: pwsh S5_01_Blazor_CS_GOATTests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E Tests against Azure
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed"
        env:
          TEST_ENVIRONMENT: Azure
        timeout-minutes: 15

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-azure
          path: '**/TestResults/*.trx'

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-azure
          path: '**/test-results/**'
          retention-days: 7

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results (Azure)
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: true
