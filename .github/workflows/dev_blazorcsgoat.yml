name: Build, Test, and Deploy Blazor to Azure

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.x'
  BLAZOR_PROJECT_PATH: 'S5_01_Blazor_CS_GOAT/S5_01_Blazor_CS_GOAT.csproj'
  TEST_PROJECT_PATH: 'S5_01_Blazor_CS_GOATTests/S5_01_Blazor_CS_GOATTests.csproj'
  AZURE_WEBAPP_NAME: 'blazorcsgoat'
  AZURE_WEBAPP_URL: 'https://blazorcsgoat-hpbpdkhmadduekef.eastus-01.azurewebsites.net'

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.BLAZOR_PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.BLAZOR_PROJECT_PATH }} -c Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.BLAZOR_PROJECT_PATH }} -c Release -o ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blazor-app
          path: ./publish/wwwroot

  test-local:
    name: Run E2E Tests (Local)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test dependencies
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build test project
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} -c Release --no-restore

      - name: Install Playwright browsers
        run: pwsh S5_01_Blazor_CS_GOATTests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Download build artifact for serving
        uses: actions/download-artifact@v4
        with:
          name: blazor-app
          path: ./wwwroot

      - name: Install dotnet-serve
        run: dotnet tool install --global dotnet-serve

      - name: Serve Blazor WASM with HTTPS
        run: |
          cd wwwroot
          nohup dotnet serve -S -p 7030 > ../serve.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > ../server.pid
          cd ..
          sleep 5

          # Verify server is still running
          if ps -p $SERVER_PID > /dev/null; then
            echo "✅ Server started with PID: $SERVER_PID"
          else
            echo "❌ Server process died immediately"
            cat serve.log
            exit 1
          fi

      - name: Wait for server
        run: |
          echo "Waiting for HTTPS server..."
          for i in {1..30}; do
            if curl -k -s -f https://localhost:7030 > /dev/null 2>&1; then
              echo "✅ Server is responding on HTTPS!"
              curl -k -I https://localhost:7030
              exit 0
            fi
            echo "⏳ Attempt $i/30..."
            if [ $((i % 5)) -eq 0 ]; then
              echo "--- Recent logs ---"
              tail -n 10 serve.log 2>/dev/null || echo "No logs"
            fi
            sleep 2
          done
          echo "❌ Server failed to respond"
          echo "=== Final logs ==="
          cat serve.log || echo "No logs"
          exit 1

      - name: Test server is responding (debug)
        run: |
          echo "=== Final server check before tests ==="
          curl -k -v https://localhost:7030 2>&1 | head -20
          echo ""
          echo "=== Server process status ==="
          ps aux | grep "dotnet serve" || echo "No server process found"

      - name: Comprehensive server debug
        run: |
          echo "=== Testing with curl ==="
          curl -k -v https://localhost:7030 2>&1 | head -30
          echo ""
          echo "=== Testing with 127.0.0.1 ==="
          curl -k -v https://127.0.0.1:7030 2>&1 | head -30
          echo ""
          echo "=== Check what's listening on port 7030 ==="
          sudo netstat -tulpn | grep 7030 || echo "Nothing on 7030"
          echo ""
          echo "=== Server logs ==="
          cat serve.log
          echo ""
          echo "=== Process info ==="
          ps aux | grep "dotnet serve"

