name: Deploy Blazor to Azure with E2E Tests

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.x'
  BLAZOR_PROJECT_PATH: 'S5_01_Blazor_CS_GOAT/S5_01_Blazor_CS_GOAT.csproj'
  TEST_PROJECT_PATH: 'S5_01_Blazor_CS_GOATTests/S5_01_Blazor_CS_GOATTests.csproj'
  AZURE_WEBAPP_NAME: 'blazorcsgoat'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.BLAZOR_PROJECT_PATH }}

      - name: Build Blazor Project
        run: dotnet build ${{ env.BLAZOR_PROJECT_PATH }} -c Release --no-restore

      - name: Publish Blazor Project
        run: dotnet publish ${{ env.BLAZOR_PROJECT_PATH }} -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blazor-app
          path: ./publish  # ✅ Upload entire published output

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Production'
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: blazor-app
          path: ./deploy

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ./deploy  # ✅ Deploy complete app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_7F9E85A1AA744ABEBECAFB00415B4D78 }}

      - name: Wait for deployment to stabilize
        run: |
          Write-Host "⏳ Waiting 30 seconds for deployment..."
          Start-Sleep -Seconds 30

          Write-Host "🔍 Testing site availability..."
          $url = "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          $maxAttempts = 20
          $attempt = 0
          $success = $false

          do {
            $attempt++
            Write-Host "Attempt $attempt/$maxAttempts..."
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ Site is responding!"
                $success = $true
                break
              }
            } catch {
              Write-Host "⏳ Not ready yet: $($_.Exception.Message)"
              if ($attempt -lt $maxAttempts) {
                Start-Sleep -Seconds 15
              }
            }
          } while ($attempt -lt $maxAttempts)

          if (-not $success) {
            Write-Host "❌ Site failed to become available after $maxAttempts attempts"
            exit 1
          }
        shell: pwsh

  test:
    runs-on: windows-latest
    needs: deploy
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test project dependencies
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build test project
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} -c Release --no-restore

      - name: Ensure Playwright is installed
        run: |
          pwsh S5_01_Blazor_CS_GOATTests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium
        shell: pwsh

      - name: Verify site is accessible before tests
        run: |
          $url = "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          Write-Host "🔍 Final check: Verifying $url is accessible..."

          try {
            $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
            Write-Host "✅ Site returned status: $($response.StatusCode)"
          } catch {
            Write-Host "❌ Site is not accessible: $($_.Exception.Message)"
            exit 1
          }
        shell: pwsh

      - name: Run Playwright E2E Tests
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=test-results.trx" `
            --logger "console;verbosity=detailed" `
            -- MSTest.Parallelize.Workers=1
        env:
          TEST_ENVIRONMENT: Azure
        shell: pwsh
        continue-on-error: false
        timeout-minutes: 15

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: '**/test-results/**'
          retention-days: 7

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

  notify:
    runs-on: windows-latest
    needs: [build, deploy, test]
    if: always()
    steps:
      - name: Check workflow status
        run: |
          if ("${{ needs.test.result }}" -eq "failure") {
            Write-Host "❌ E2E Tests Failed!"
            exit 1
          } elseif ("${{ needs.deploy.result }}" -eq "failure") {
            Write-Host "❌ Deployment Failed!"
            exit 1
          } elseif ("${{ needs.build.result }}" -eq "failure") {
            Write-Host "❌ Build Failed!"
            exit 1
          } else {
            Write-Host "✅ All stages completed successfully!"
          }
        shell: pwsh
