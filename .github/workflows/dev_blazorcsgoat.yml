name: Deploy Blazor to Azure with E2E Tests

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.x'
  BLAZOR_PROJECT_PATH: 'S5_01_Blazor_CS_GOAT/S5_01_Blazor_CS_GOAT.csproj'
  TEST_PROJECT_PATH: 'S5_01_Blazor_CS_GOATTests/S5_01_Blazor_CS_GOATTests.csproj'
  AZURE_WEBAPP_NAME: 'blazorcsgoat'
  AZURE_WEBAPP_URL: 'https://blazorcsgoat-hpbpdkhmadduekef.eastus-01.azurewebsites.net'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.BLAZOR_PROJECT_PATH }}

      - name: Build Blazor Project
        run: dotnet build ${{ env.BLAZOR_PROJECT_PATH }} -c Release --no-restore

      - name: Publish Blazor Project
        run: dotnet publish ${{ env.BLAZOR_PROJECT_PATH }} -c Release -o ./publish

      - name: Verify publish output
        run: |
          echo "📦 Published files:"
          ls -la ./publish
          echo ""
          echo "🔍 Checking for web.config:"
          if [ -f ./publish/web.config ]; then
            echo "✅ web.config found"
            cat ./publish/web.config
          else
            echo "⚠️ web.config NOT found"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blazor-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ env.AZURE_WEBAPP_URL }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: blazor-app
          path: ./deploy

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ./deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_7F9E85A1AA744ABEBECAFB00415B4D78 }}

      - name: Wait for deployment to stabilize
        run: |
          echo "⏳ Waiting 60 seconds for deployment and app warmup..."
          sleep 60

          echo "🔍 Testing site availability..."
          url="${{ env.AZURE_WEBAPP_URL }}"
          max_attempts=20
          attempt=0
          success=false

          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts..."

            status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")

            if [ "$status_code" = "200" ]; then
              echo "✅ Site is responding with status 200!"
              success=true
              break
            else
              echo "⏳ Not ready yet. Status code: $status_code"

              if [ "$status_code" = "500" ]; then
                echo "⚠️ App is deployed but returning 500 - may need more time to initialize"
              fi

              if [ $attempt -lt $max_attempts ]; then
                sleep 15
              fi
            fi
          done

          if [ "$success" = false ]; then
            echo "❌ Site failed to become available after $max_attempts attempts"
            echo "💡 Check Azure App Service logs for detailed error information"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test project dependencies
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build test project
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} -c Release --no-restore

      - name: Ensure Playwright is installed
        run: |
          pwsh S5_01_Blazor_CS_GOATTests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Verify site is accessible before tests
        run: |
          url="${{ env.AZURE_WEBAPP_URL }}"
          echo "🔍 Final check: Verifying $url is accessible..."

          status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")

          if [ "$status_code" = "200" ]; then
            echo "✅ Site returned status: $status_code"
          else
            echo "❌ Site is not accessible. Status: $status_code"
            exit 1
          fi

      - name: Run Playwright E2E Tests
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed" \
            -- MSTest.Parallelize.Workers=1
        env:
          TEST_ENVIRONMENT: Azure
          BASE_URL: ${{ env.AZURE_WEBAPP_URL }}
        continue-on-error: false
        timeout-minutes: 15

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: '**/test-results/**'
          retention-days: 7

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy, test]
    if: always()
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "❌ E2E Tests Failed!"
            exit 1
          elif [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "❌ Deployment Failed!"
            exit 1
          elif [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ Build Failed!"
            exit 1
          else
            echo "✅ All stages completed successfully!"
          fi
